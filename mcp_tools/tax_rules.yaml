# שיעורים מפושטים להמחשה. יש לאמת מול רשות המסים / משרד האוצר לפני הגשה.
inflation_default: "0.025"
notes:
  - "זו הערכה מפושטת, בלי מס יסף, קיזוז הפסדים או מקרים מיוחדים."
  - "השיעורים נקראים מקובץ הכללים ויש לאמת אותם מול רשות המסים."

