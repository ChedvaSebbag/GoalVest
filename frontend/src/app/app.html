<mat-toolbar class="topbar">
  <span class="brand">GoalVest</span>
  <span class="tagline">השקעות מבוססות-מטרות</span>
  <span class="spacer"></span>
  <a routerLink="/system">מצב המערכת</a>
  @if (user(); as current) {
    @if (current.role === 'INVESTOR') {
      <a routerLink="/investor" routerLinkActive="active">היעדים שלי</a>
      <a routerLink="/investor/offers" routerLinkActive="active">הצעות</a>
      <gv-notification-bell />
    } @else if (current.role === 'AGENT') {
      <a routerLink="/agent" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">דשבורד</a>
      <a routerLink="/agent/products" routerLinkActive="active">המוצרים שלי</a>
    }
    <a routerLink="/products" routerLinkActive="active">השוואת מוצרים</a>
    <button type="button" (click)="logout()">התנתקות</button>
  }
</mat-toolbar>
<main>
  <router-outlet />
</main>
<footer class="disclaimer">
  המידע וההערכות במערכת נוצרו אוטומטית לצורכי המחשה ואינם מהווים ייעוץ השקעות.
</footer>
