# תשתית מקומית ל-GoalVest
#
# ברירת מחדל: רק ChromaDB (מסד וקטורי).
#   docker compose up -d
#
# Ollama רץ ישירות על ה-Mac (מהיר יותר – משתמש ב-GPU של Apple) ומאזין ל-localhost:11434.
# מי שרוצה בכל זאת להריץ את Ollama בתוך Docker (למשל על Windows/Linux):
#   docker compose --profile docker-ollama up -d
services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["docker-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
